<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" role="img" aria-labelledby="title description">
  <title id="title">albttx nixpkgs</title>
  <desc id="description">Personal Nix configuration for macOS, NixOS, and Home Manager.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1d32"/>
      <stop offset="1" stop-color="#102b3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78f5d0"/>
      <stop offset="1" stop-color="#b7ff4a"/>
    </linearGradient>
    <linearGradient id="flake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7ff4a"/>
      <stop offset="1" stop-color="#62d9ff"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9bd5e5" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="440" rx="24" fill="url(#background)"/>
  <rect width="1600" height="440" rx="24" fill="url(#grid)"/>
  <ellipse cx="1280" cy="90" rx="260" ry="150" fill="#39d9d1" fill-opacity="0.08" filter="url(#soft-glow)"/>
  <ellipse cx="260" cy="390" rx="250" ry="120" fill="#79ff4a" fill-opacity="0.06" filter="url(#soft-glow)"/>

  <g fill="none" stroke="#72dbed" stroke-opacity="0.24" stroke-width="2">
    <path d="M0 334L170 270L330 342L505 236L670 286"/>
    <path d="M1070 126L1210 192L1375 110L1600 174"/>
    <path d="M1190 355L1300 288L1450 328L1600 252"/>
  </g>
  <g fill="#b7ff4a" filter="url(#glow)">
    <circle cx="170" cy="270" r="4"/>
    <circle cx="330" cy="342" r="4"/>
    <circle cx="505" cy="236" r="4"/>
    <circle cx="1210" cy="192" r="4"/>
    <circle cx="1375" cy="110" r="4"/>
    <circle cx="1450" cy="328" r="4"/>
  </g>

  <g transform="translate(176 220)" fill="none" stroke="url(#flake)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="14">
      <path d="M0-108V108"/>
      <path d="M-93-54L93 54"/>
      <path d="M-93 54L93-54"/>
    </g>
    <g stroke-width="9">
      <path d="M0-108L-23-80M0-108L23-80M0 108L-23 80M0 108L23 80"/>
      <path d="M-93-54L-61-52M-93-54L-70-76M93 54L61 52M93 54L70 76"/>
      <path d="M-93 54L-70 76M-93 54L-61 52M93-54L70-76M93-54L61-52"/>
    </g>
    <circle r="15" fill="#0b1d32" stroke-width="8"/>
  </g>

  <g transform="translate(365 112)">
    <text x="0" y="106" fill="#f3fbff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="86" font-weight="700" letter-spacing="-3">albttx</text>
    <rect x="3" y="133" width="520" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="184" fill="#b9cbd5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="24" letter-spacing="4">NIX CONFIGURATION</text>
    <text x="0" y="226" fill="#78f5d0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18">macOS  |  NixOS  |  Home Manager</text>
  </g>

  <g transform="translate(1255 335)">
    <rect width="238" height="48" rx="24" fill="#081522" fill-opacity="0.72" stroke="#78f5d0" stroke-opacity="0.42"/>
    <circle cx="25" cy="24" r="5" fill="#b7ff4a"/>
    <text x="43" y="30" fill="#dcecf0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16">declarative by design</text>
